services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      retries: 10
    networks:
      - warehouse-net

  products:
    build: ./products
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse-net

  stock:
    build: ./stock
    environment:
      ProductsService__BaseUrl: http://products:8080
      NotificationsService__BaseUrl: http://notifications:8080
    depends_on:
      - products
    networks:
      - warehouse-net

  notifications:
    build: ./notifications
    networks:
      - warehouse-net

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      ProductsService__BaseUrl: http://products:8080
      StockService__BaseUrl: http://stock:8080
      NotificationsService__BaseUrl: http://notifications:8080
    depends_on:
      - products
      - stock
      - notifications
    networks:
      - warehouse-net

volumes:
  db_data:

networks:
  warehouse-net:
    driver: bridge